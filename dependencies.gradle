dependencies {
    compileOnly("org.projectlombok:lombok:1.18.32")
    annotationProcessor("org.projectlombok:lombok:1.18.32")

    implementation 'thedarkcolour:kotlinforforge-neoforge:5.5.0'

    implementation 'org.spongepowered:mixin:0.8.5'
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    jarJar(api(project(":Registrate")))
    jarJar(api(project(":TcLib")))

    jarJar(api("com.lowdragmc.ldlib2:ldlib2-neoforge-1.21.1:${ldlib_version}:all"){ transitive = false })
    compileOnly("org.appliedenergistics.yoga:yoga:1.0.0")

    // EMI
    compileOnly("dev.emi:emi-neoforge:${emi_version}:api")
    implementation("dev.emi:emi-neoforge:${emi_version}")

    // AE2
    compileOnly("org.appliedenergistics:appliedenergistics2:${ae2_version}:api")
    jarJar(api("org.appliedenergistics:appliedenergistics2:${ae2_version}"))
    jarJar(api("org.appliedenergistics:guideme:${guideme_version}"))
}
